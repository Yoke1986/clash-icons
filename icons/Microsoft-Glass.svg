<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Four-color glass-style Microsoft service icon</title>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F7F8FD"/>
      <stop offset="1" stop-color="#E7EAF7"/>
    </linearGradient>
    <radialGradient id="warmGlow"><stop stop-color="#FFD2B8" stop-opacity="0.58"/><stop offset="1" stop-color="#FFD2B8" stop-opacity="0"/></radialGradient>
    <radialGradient id="blueGlow"><stop stop-color="#ACCEFF" stop-opacity="0.5"/><stop offset="1" stop-color="#ACCEFF" stop-opacity="0"/></radialGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#FFC0A1"/><stop offset="0.46" stop-color="#FC795F"/><stop offset="1" stop-color="#DD3E51"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#DCF4AA"/><stop offset="0.46" stop-color="#A1D965"/><stop offset="1" stop-color="#5EAD46"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#ABE3FC"/><stop offset="0.46" stop-color="#52B8F4"/><stop offset="1" stop-color="#237FDC"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#FFF0B6"/><stop offset="0.46" stop-color="#FFD267"/><stop offset="1" stop-color="#EDA53B"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="white" stop-opacity="0.52"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="frame"><rect width="1024" height="1024" rx="220"/></clipPath>
    <clipPath id="panes">
      <rect x="181" y="181" width="315" height="315" rx="57"/>
      <rect x="528" y="181" width="315" height="315" rx="57"/>
      <rect x="181" y="528" width="315" height="315" rx="57"/>
      <rect x="528" y="528" width="315" height="315" rx="57"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1024" height="1024" rx="220" fill="url(#canvas)"/>
    <ellipse cx="254" cy="254" rx="470" ry="470" fill="url(#warmGlow)"/>
    <ellipse cx="795" cy="785" rx="470" ry="470" fill="url(#blueGlow)"/>
    <g fill="#35436D" opacity="0.19" filter="url(#shadow)">
      <rect x="184" y="203" width="309" height="309" rx="57"/>
      <rect x="531" y="203" width="309" height="309" rx="57"/>
      <rect x="184" y="550" width="309" height="309" rx="57"/>
      <rect x="531" y="550" width="309" height="309" rx="57"/>
    </g>
    <g stroke="white" stroke-opacity="0.46" stroke-width="3">
      <rect x="181" y="181" width="315" height="315" rx="57" fill="url(#red)"/>
      <rect x="528" y="181" width="315" height="315" rx="57" fill="url(#green)"/>
      <rect x="181" y="528" width="315" height="315" rx="57" fill="url(#blue)"/>
      <rect x="528" y="528" width="315" height="315" rx="57" fill="url(#gold)"/>
    </g>
    <g clip-path="url(#panes)" fill="url(#sheen)">
      <path d="M181 181H496V293C414 339 287 323 181 380Z"/>
      <path d="M528 181H843V293C761 339 634 323 528 380Z"/>
      <path d="M181 528H496V640C414 686 287 670 181 727Z"/>
      <path d="M528 528H843V640C761 686 634 670 528 727Z"/>
    </g>
    <rect x="2" y="2" width="1020" height="1020" rx="218" fill="none" stroke="white" stroke-opacity="0.7" stroke-width="4"/>
  </g>
